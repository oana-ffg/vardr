[package]
name = "vardr"
version = "0.5.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Lightweight automations with a CLI, optional dashboard, and agent failure investigations"
repository = "https://github.com/oana-ffg/vardr"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
libc = "0.2"
minisign-verify = "0.3"
plist = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self-replace = "1"
tempfile = "3"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[[bin]]
name = "vardr"
path = "src/main.rs"

[workspace]
members = ["desktop/src-tauri"]
default-members = ["."]
resolver = "2"
