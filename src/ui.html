<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vardr · Automations</title>
<style>
:root{color-scheme:dark;--bg:#101517;--panel:#192124;--line:#303c3f;--ink:#edf3ef;--muted:#a1b4b0;--accent:#bcdf87;--danger:#ffaaa2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main{max-width:1130px;margin:auto;padding:28px 32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-size:24px;font-weight:750;letter-spacing:-1px}.brand span{color:var(--accent)}.muted{color:var(--muted)}h1{font-size:32px;letter-spacing:-1px;margin:4px 0 8px}h2{font-size:18px;margin:0}p{margin:8px 0}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.stats{display:flex;gap:12px;margin:25px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 20px;flex:1}.stat strong{font-size:25px;display:block}.toolbar{display:flex;gap:12px;margin-bottom:20px}input,select,button{font:inherit;color:inherit;background:#11191b;border:1px solid #445558;border-radius:7px;padding:8px 11px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--accent);color:#16200d;border-color:var(--accent);font-weight:650}#search{flex:1}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tag{font-size:12px;border:1px solid var(--line);padding:3px 9px;border-radius:20px;color:var(--muted)}.status{color:var(--accent)}.failed,.timed_out,.interrupted,.dispatch_unknown{color:var(--danger)}.controls{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.schedule{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input[type=time]{width:115px}.timezone{max-width:210px}.interval{width:90px}label{display:flex;align-items:center;gap:8px}.spacer{flex:1}.feedback{position:sticky;top:8px;background:#352420;border:1px solid #a86b5c;border-radius:8px;padding:12px;margin-bottom:12px}#notice:empty{display:none}code{font:12px ui-monospace,monospace;color:var(--muted)}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:900px;width:90vw}dialog::backdrop{background:#0009}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto;font:12px/1.6 ui-monospace,monospace}.empty{border:1px dashed var(--line);border-radius:12px;padding:30px}.empty code{display:block;margin-top:14px}.service{font-size:13px}.foot{margin:25px 0;color:var(--muted);font-size:12px}@media(max-width:650px){header,main{padding:20px}.row,.intro{flex-direction:column}.stats{gap:8px}.stat{padding:12px}.controls{gap:10px}.toolbar{flex-direction:column}}
</style></head><body>
<header><div class="brand"><span>◈</span> Vardr</div><div class="service" id="service">Local automations</div></header>
<main><div class="intro"><div><p class="muted">YOUR AUTOMATIONS</p><h1>Know what’s running.</h1><p class="muted">What it does, when it runs, and what happened last.</p></div><button id="refresh">Refresh</button></div>
<div id="notice" role="alert" class="feedback"></div><div class="stats" id="stats"></div>
<div class="toolbar"><input id="search" aria-label="Search automations" placeholder="Search names, purposes, projects…"><select id="filter" aria-label="Filter automations"><option value="all">All automations</option><option value="enabled">Enabled</option><option value="paused">Paused</option><option value="failed">Needs attention</option></select></div>
<div id="jobs"></div><p class="foot">This dashboard manages this installation. The scheduler runs independently. T3 tasks show dispatch receipts; their execution results live in T3.</p></main>
<dialog id="log"><div class="row"><h2>Latest run output</h2><button id="close-log">Close</button></div><pre id="log-text"></pre></dialog>
<script>
const token='__VARDR_TOKEN__';history.replaceState(null,'','/');let items=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Vardr-Token':token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
function notice(e){$('notice').textContent=e?String(e.message||e):''}
function clock(t){return t?new Date(t).toLocaleString():'Never run'}
async function refresh(){try{const data=await api('/api/jobs');items=data.jobs;const errors=[...Object.values(data.service?.errors||{}),...Object.values(data.errors||{})];$('service').textContent=data.service_running?'● Scheduler running':'○ Scheduler stopped';if(errors.length)notice(errors.join('\n'));render()}catch(e){notice(e)}}
function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const bad=x=>x.latest&&['failed','timed_out','interrupted','dispatch_unknown'].includes(x.latest.status);$('stats').innerHTML=`<div class="stat"><strong>${items.length}</strong><span class="muted">Automations</span></div><div class="stat"><strong>${items.filter(x=>x.job.enabled).length}</strong><span class="muted">Enabled</span></div><div class="stat"><strong>${items.filter(bad).length}</strong><span class="muted">Need attention</span></div>`;
const shown=items.filter(x=>JSON.stringify([x.job.name,x.job.purpose,x.job.project,x.job.machine]).toLowerCase().includes(q)).filter(x=>f==='all'||(f==='enabled'&&x.job.enabled)||(f==='paused'&&!x.job.enabled)||(f==='failed'&&bad(x)));
$('jobs').innerHTML=shown.map(({job:j,latest:r})=>`<article class="card" data-id="${esc(j.id)}"><div class="row"><div><h2>${esc(j.name)}</h2><p class="muted">${esc(j.purpose)}</p></div><span class="tag status ${esc(r?.status||'')}">${esc(r?.status||'Never run')}</span></div><div class="tags"><span class="tag">${esc(j.target.type)}</span>${j.project?`<span class="tag">${esc(j.project)}</span>`:''}${j.machine?`<span class="tag">${esc(j.machine)}</span>`:''}<span class="tag">${j.enabled?'Enabled':'Paused'}</span></div><p class="muted">Last started: ${esc(clock(r?.started_at))}${r?.investigation?` · Investigation: ${esc(r.investigation.status)}`:''}</p>${r?.error?`<p class="failed">${esc(r.error)}</p>`:''}${r?.remote?.threadId?`<p><a href="t3-thread://v1/${encodeURIComponent(r.remote.threadId)}">Open T3 thread</a></p>`:''}<code>${esc(j.id)}</code><div class="controls"><div class="schedule"><select aria-label="Schedule type" data-field="type"><option ${j.schedule.type==='manual'?'selected':''} value="manual">Manual</option><option ${j.schedule.type==='daily'?'selected':''} value="daily">Daily</option><option ${j.schedule.type==='interval'?'selected':''} value="interval">Interval</option></select><input type="time" aria-label="Daily time" value="${esc(j.schedule.time||'03:00')}" data-field="time"><input class="timezone" aria-label="Timezone" value="${esc(j.schedule.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone)}" data-field="timezone"><input type="number" class="interval" min="10" aria-label="Interval seconds" value="${j.schedule.seconds||3600}" data-field="seconds"><button data-action="save">Save schedule</button></div><span class="spacer"></span><button data-action="pause">${j.enabled?'Pause':'Resume'}</button><button data-action="logs">Output</button><button class="primary" data-action="run">Run now</button></div><div class="controls"><label><input type="checkbox" data-action="investigate" ${j.investigation?.enabled?'checked':''} ${!j.investigation?'disabled':''}> Spawn an agent to investigate failures</label><span class="muted">${j.investigation?esc(j.investigation.target.type)+' · diagnosis only':'Configure an investigator through the CLI to enable'}</span></div></article>`).join('')||`<div class="empty">${items.length?'No matching automations.':'No automations yet. Add your first job through the CLI.'}<code>vardr put job.json</code></div>`;
document.querySelectorAll('.card').forEach(updateScheduleFields)}
function updateScheduleFields(card){const type=card.querySelector('[data-field=type]').value;for(const field of ['time','timezone'])card.querySelector(`[data-field=${field}]`).hidden=type!=='daily';card.querySelector('[data-field=seconds]').hidden=type!=='interval'}
$('jobs').addEventListener('change',e=>{const card=e.target.closest('.card');if(e.target.dataset.field==='type')updateScheduleFields(card);if(e.target.dataset.action==='investigate')act(card,'investigate',e.target)});
$('jobs').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b)act(b.closest('.card'),b.dataset.action,b)});
async function act(card,action,button){const original=items.find(x=>x.job.id===card.dataset.id).job,j=structuredClone(original);button.disabled=true;notice('');try{if(action==='run'){await api('/api/run',{id:j.id});await new Promise(r=>setTimeout(r,300))}else if(action==='logs'){$('log-text').textContent=(await api('/api/logs/'+j.id)).text;$('log').showModal();return}else{if(action==='pause')j.enabled=!j.enabled;if(action==='investigate')j.investigation.enabled=button.checked;if(action==='save'){const field=n=>card.querySelector(`[data-field=${n}]`).value;const type=field('type');j.schedule=type==='manual'?{type}:type==='interval'?{type,seconds:Number(field('seconds'))}:{type,time:field('time'),timezone:field('timezone'),weekdays:j.schedule.weekdays||[]}}await api('/api/job',j)}await refresh()}catch(e){notice(e);await refresh()}finally{button.disabled=false}}
$('refresh').onclick=refresh;$('search').oninput=render;$('filter').onchange=render;$('close-log').onclick=()=>$('log').close();refresh();
</script></body></html>
