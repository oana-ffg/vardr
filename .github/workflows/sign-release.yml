name: Sign verified update artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unpublished draft tag matching this main commit
        required: true
        type: string
      hashes:
        description: JSON SHA256 map from the local Apple publisher
        required: true
        type: string
      candidate_run:
        description: Successful candidate run for this exact main commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: vardr-draft-signing-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run }}
      RELEASE_TAG: ${{ inputs.tag }}
      VERIFIED_HASHES: ${{ inputs.hashes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
        working-directory: desktop
      - run: cargo build --release --locked -p vardr
      - name: Download exact draft and verify Apple publisher/notarization
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: python3 -B scripts/finalize_release.py prepare --directory artifacts
      - name: Sign the verified bytes with the unchanged updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: python3 -B scripts/finalize_release.py sign --directory artifacts
      - name: Verify signatures/version and attach manifests to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/finalize_release.py upload --directory artifacts
