name: Build signed draft release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Sign standalone binary
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/vardr" "artifacts/vardr-${{ matrix.platform }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            python3 scripts/macos_signing.py "artifacts/vardr-${{ matrix.platform }}" --identifier dev.vardr.cli --team-id "$APPLE_TEAM_ID"
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          npx --yes @tauri-apps/cli@2.12.3 signer sign --app-version "$version" "artifacts/vardr-${{ matrix.platform }}"
      - name: Verify published signature against compiled trust key
        run: artifacts/vardr-${{ matrix.platform }} verify artifacts/vardr-${{ matrix.platform }} artifacts/vardr-${{ matrix.platform }}.sig
      - name: Build and sign macOS app
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx --yes @tauri-apps/cli@2.12.3 build --target ${{ matrix.target }} --bundles app --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Collect and verify macOS desktop artifacts
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          python3 scripts/check-desktop-bundle.py "target/${{ matrix.target }}/release/bundle/macos/Vardr.app" --publisher-team-id "$APPLE_TEAM_ID"
          cp "target/${{ matrix.target }}/release/bundle/macos/Vardr.app.tar.gz" "artifacts/Vardr-${{ matrix.platform }}.app.tar.gz"
          cp "target/${{ matrix.target }}/release/bundle/macos/Vardr.app.tar.gz.sig" "artifacts/Vardr-${{ matrix.platform }}.app.tar.gz.sig"
          python3 scripts/create-desktop-dmg.py "target/${{ matrix.target }}/release/bundle/macos/Vardr.app" "artifacts/Vardr-${{ matrix.platform }}.dmg"
          artifacts/vardr-${{ matrix.platform }} verify "artifacts/Vardr-${{ matrix.platform }}.app.tar.gz" "artifacts/Vardr-${{ matrix.platform }}.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create signed-asset manifest and draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python3 scripts/release-manifest.py artifacts "$version" "$GITHUB_REPOSITORY"
          gh release create "v$version" artifacts/* --draft --target "$GITHUB_SHA" --title "Vardr $version" --generate-notes
