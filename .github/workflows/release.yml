name: Build release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: release
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: runner.os == 'macOS'
        with:
          node-version: 24
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: npm ci
        if: runner.os == 'macOS'
        working-directory: desktop
      - name: Build unsigned macOS app candidate
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - name: Stage macOS candidate without AppleDouble metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          app="target/${{ matrix.target }}/release/bundle/macos/Vardr.app"
          python3 scripts/check-desktop-bundle.py "$app"
          ditto --norsrc --noextattr --noacl -c -k --keepParent "$app" "artifacts/Vardr-candidate-${{ matrix.platform }}.zip"
      - name: Stage Linux candidate
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/vardr artifacts/vardr-${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
